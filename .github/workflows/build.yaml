name: Build binaries

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-ta:
    name: build-ta (OP-TEE ${{ matrix.optee.version }}, Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      matrix:
        optee:
          - version: 3.10.0
            sha: d1c635434c55b7d75eadf471bde04926bd1e50a7
          - version: 3.20.0
            sha: 8e74d47616a20eaa23ca692f4bbbf917a236ed94
          - version: 4.0.0
            sha: 2a5b1d1232f582056184367fb58a425ac7478ec6
          - version: 4.8.0
            sha: 86660925433a8d4d1b19cfa5fe940081d77b34b4
          - version: 4.10.0
            sha: 753afbbee1682f5d16fd30e87b31058a4fd4f4b8
        ubuntu:
          - "22.04"
          - "24.04"
          - "26.04"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: optee-uc-fde
          persist-credentials: false
      - name: Checkout OP-TEE OS
        uses: actions/checkout@v7
        with:
          repository: op-tee/optee_os
          path: optee
          ref: ${{ matrix.optee.sha }}
          persist-credentials: false
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential device-tree-compiler \
            python3-pyelftools python3-pycryptodome \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      - name: Build TA dev kit
        env:
          PLATFORM: vexpress-qemu_armv8a
          CFG_ARM64_core: y
          # Workaround for building earlier versions of OP-TEE with newer binutils
          LDFLAGS: --no-warn-rwx-segments --no-warn-execstack
        run: |
          make -C optee -j"$(nproc)" ta_dev_kit
      - name: Build TA (arm64)
        env:
          CROSS_COMPILE_TA: aarch64-linux-gnu-
        run: |
          make -C optee-uc-fde/ta \
            O="$GITHUB_WORKSPACE/optee-uc-fde/out/ta_arm64" \
            TA_DEV_KIT_DIR="$GITHUB_WORKSPACE/optee/out/arm-plat-vexpress/export-ta_arm64" \
            CROSS_COMPILE="$CROSS_COMPILE_TA"
          test -f optee-uc-fde/out/ta_arm64/ta/fde_key_handler/fd1b2a86-3668-11eb-adc1-0242ac120002.ta
      - name: Build TA (arm32)
        env:
          CROSS_COMPILE_TA: arm-linux-gnueabihf-
        run: |
          make -C optee-uc-fde/ta \
            O="$GITHUB_WORKSPACE/optee-uc-fde/out/ta_arm32" \
            TA_DEV_KIT_DIR="$GITHUB_WORKSPACE/optee/out/arm-plat-vexpress/export-ta_arm32" \
            CROSS_COMPILE="$CROSS_COMPILE_TA"
          test -f optee-uc-fde/out/ta_arm32/ta/fde_key_handler/fd1b2a86-3668-11eb-adc1-0242ac120002.ta
